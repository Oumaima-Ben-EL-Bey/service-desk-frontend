<div class="auth-page">
  <aside class="auth-panel">
    <div class="auth-panel-top">
      <span class="auth-eyebrow">New here</span>
      <h2 class="auth-panel-heading">An account takes about twenty seconds.</h2>
    </div>
    <div class="auth-panel-bottom">
      <span class="auth-eyebrow">How it works</span>
      <ul class="auth-steps">
        <li class="auth-step"><img class="auth-step-dot" src="/status/dot-new.svg" alt="" />Describe the problem</li>
        <li class="auth-step"><img class="auth-step-dot" src="/status/dot-in-progress.svg" alt="" />An agent picks it up</li>
        <li class="auth-step"><img class="auth-step-dot" src="/status/dot-resolved.svg" alt="" />You're told when it's fixed</li>
      </ul>
    </div>
  </aside>

  <main class="auth-main">
    <form class="auth-form" (ngSubmit)="onRegister()" #form="ngForm">
      <div class="auth-head">
        <h1 class="auth-heading">Create an account</h1>
        <p class="auth-sub">You'll start as a requester.</p>
      </div>

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required email />
      </div>

      <div class="field">
        <label class="field-label" for="fullName">Full name</label>
        <input type="text" id="fullName" [(ngModel)]="fullName" name="fullName" required />
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required minlength="8" />
      </div>

      @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
      }

      <button class="auth-submit" type="submit" [disabled]="form.invalid">Register</button>

      <p class="auth-alt">Already have an account? <a routerLink="/login">Log in</a></p>
    </form>
  </main>
</div>
