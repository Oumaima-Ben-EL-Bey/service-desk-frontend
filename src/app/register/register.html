<form (ngSubmit)="onRegister()" #form="ngForm">
  <label for="email">Email</label>
  <input type="email" id="email" [(ngModel)]="email" name="email" required email />

  <label for="fullName">Full name</label>
  <input type="text" id="fullName" [(ngModel)]="fullName" name="fullName" required />

  <label for="password">Password</label>
  <input type="password" id="password" [(ngModel)]="password" name="password" required minlength="8" />

  @if (errorMessage()) {
  <p class="form-error">{{ errorMessage() }}</p>
  }

  <button type="submit" [disabled]="form.invalid">Register</button>
  <a routerLink="/login">Already have an account? Log in</a>
</form>
