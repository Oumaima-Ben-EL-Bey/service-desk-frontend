@if (ticket(); as t) {
<article class="ticket-detail">
  <h1 class="detail-title">{{ t.title }}</h1>
  <p class="detail-desc">{{ t.description }}</p>
  <p class="detail-meta">Status: {{ t.status }}</p>
  <p class="detail-meta">Category: {{ t.category }}</p>
  <p class="detail-meta">Requested by: {{ t.requesterId }}</p>
</article>
} @else {
<p class="detail-loading">Loading…</p>
}
